name: Update Snapshots

# Triggered by commenting "/update-snapshots" on a pull request.
# Re-renders the visual baselines inside the same Docker image used by CI and
# pushes the updated snapshots back to the PR branch.
#
# NOTE: issue_comment workflows only run from the version of this file on the
# default branch, so this must be merged to the default branch before the
# command works. For security it is limited to non-fork PRs opened/commented by
# users with write access (OWNER / MEMBER / COLLABORATOR).
on:
  issue_comment:
    types: [created]

jobs:
  update-snapshots:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/update-snapshots')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate permissions and resolve PR branch
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const allowed = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const assoc = context.payload.comment.author_association;
            if (!allowed.includes(assoc)) {
              core.setFailed(
                `@${context.payload.comment.user.login} (${assoc}) does not have write access; ignoring /update-snapshots.`
              );
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });

            const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
            if (pr.head.repo.full_name !== baseRepo) {
              core.setFailed(
                'Snapshot updates are only supported for branches in this repository, not forks.'
              );
              return;
            }

            core.setOutput('ref', pr.head.ref);

            // Acknowledge the command so the user knows it was picked up.
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build snapshot testing Docker image
        run: npm run build:docker-for-storybook-testing

      - name: Update snapshots
        run: npm run update-snapshots:docker
        working-directory: packages/openbridge-webcomponents

      - name: Commit and push updated snapshots
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/openbridge-webcomponents/__vis__/linux/__baselines__
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "test: update visual snapshots"
            git push origin HEAD:"${{ steps.pr.outputs.ref }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}';
            const changed = '${{ steps.commit.outputs.changed }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            if (status === 'success') {
              body = changed === 'true'
                ? '✅ Visual snapshots re-rendered and pushed to this PR.'
                : 'ℹ️ Ran the snapshot update — the baselines were already up to date.';
            } else {
              body = `❌ Snapshot update failed. See the [workflow run](${runUrl}) for details.`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });
