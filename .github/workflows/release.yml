name: Release

on:
  push:
    branches:
      - develop
      - stable
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build core and generate wrappers
        working-directory: ./packages/openbridge-webcomponents
        run: npm run build:full

      - name: Install wrapper dependencies
        run: npm install

      - name: Build Angular wrapper
        working-directory: ./packages/openbridge-webcomponents-ng
        run: npm run build

      - name: Prepare full-bundle publish directory
        run: npx tsx packages/openbridge-webcomponents/script/prepare-full-bundle.ts

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npx semantic-release

      # A real merge commit, never a squashed PR: develop's next prerelease is
      # numbered from the newest tag in its own history.
      - name: Merge stable back into develop
        if: github.ref == 'refs/heads/stable'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "semantic-release-bot"
          git config user.email "semantic-release-bot@martynus.net"
          manual="Merge it by hand with a merge commit (git merge origin/stable on develop, then push), not a squashed pull request."
          git fetch --tags "$remote" \
            +refs/heads/develop:refs/remotes/origin/develop \
            +refs/heads/stable:refs/remotes/origin/stable
          if git merge-base --is-ancestor origin/stable origin/develop; then
            echo "develop already contains stable"
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/backmerge" origin/develop
          cd "$RUNNER_TEMP/backmerge"
          tag=$(git describe --tags --abbrev=0 origin/stable)
          if ! git merge --no-ff origin/stable -m "chore: merge stable into develop after ${tag}"; then
            echo "::error::stable does not merge cleanly into develop. $manual"
            exit 1
          fi
          if ! git push "$remote" HEAD:develop; then
            echo "::error::Pushing the merge to develop failed. $manual"
            exit 1
          fi
