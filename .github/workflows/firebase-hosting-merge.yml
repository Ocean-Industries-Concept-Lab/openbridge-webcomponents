# Deploys Storybook and the vue demo to the live sites: develop to
# openbridge-next-*, stable to openbridge-*. The firebase.json files name the
# next sites; a stable deploy rewrites the site before deploying.
#
# It runs after the Release workflow rather than on the push, and checks out
# the branch tip. The release commit is pushed with [skip ci], so a deploy of
# the pushed commit would show the previous version and changelog.
name: Deploy to Firebase Hosting on merge
"on":
  workflow_run:
    workflows: [Release]
    branches: [develop, stable]
    types: [completed]
  workflow_dispatch:

env:
  BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}

jobs:
  build_and_deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      contains(fromJSON('["develop", "stable"]'), github.event.workflow_run.head_branch || github.ref_name)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ env.BRANCH }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build openbridge-webcomponents
        run: cd packages/openbridge-webcomponents && npm run build:full

      - name: Install wrapper dependencies
        run: npm install

      - name: Build openbridge-webcomponents-vue
        run: cd packages/openbridge-webcomponents-vue && npm run build

      - name: Build vue-demo
        run: cd packages/vue-demo && npm run build

      - name: Point firebase.json at the stable site
        if: env.BRANCH == 'stable'
        working-directory: packages/vue-demo
        run: jq '.hosting[0].site = "openbridge-demo"' firebase.json > firebase.tmp.json && mv firebase.tmp.json firebase.json

      # Node 24.17.0 has an HTTP keep-alive socket-reuse bug that causes
      # firebase-tools to hit "premature close" errors against googleapis.com,
      # leading to false-negative deploy failures. Pin to the patched 24.18.0.
      - name: Pin Node for Firebase deploy
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_OPENBRIDGE_DEMO }}"
          channelId: live
          projectId: openbridge-demo
          entrypoint: "packages/vue-demo"
  build_and_deploy_storybook:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      contains(fromJSON('["develop", "stable"]'), github.event.workflow_run.head_branch || github.ref_name)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Analyze
        run: cd packages/openbridge-webcomponents && npm run analyze

      - name: Build storybook
        run: cd packages/openbridge-webcomponents && npm run build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Point firebase.json at the stable site
        if: env.BRANCH == 'stable'
        working-directory: packages/openbridge-webcomponents
        run: jq '.hosting.site = "openbridge-storybook"' firebase.json > firebase.tmp.json && mv firebase.tmp.json firebase.json

      # Node 24.17.0 has an HTTP keep-alive socket-reuse bug that causes
      # firebase-tools to hit "premature close" errors against googleapis.com,
      # leading to false-negative deploy failures. Pin to the patched 24.18.0.
      - name: Pin Node for Firebase deploy
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_OPENBRIDGE_DEMO }}"
          channelId: live
          projectId: openbridge-demo
          entrypoint: "packages/openbridge-webcomponents"
