# Deploys the Storybook and vue-demo builds to a per-pull-request preview
# channel.
#
# The channel id is `pr-<number>` and nothing else. It used to carry the PR
# title as well, which meant every retitle abandoned a channel and created
# another: the comment was updated but any link copied earlier kept serving the
# old build, and the sites ran into Firebase's per-site channel quota (429,
# "channel quota reached") with the deploy failing on a green build.
name: Deploy to Firebase Hosting on pull request

on:
  workflow_run:
    workflows: [build_demo]
    types:
      - completed

jobs:
  depoloy_storybook_to_firebase:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Download pr artifact"
        uses: actions/github-script@v8
        with:
          script: |
            var artifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: ${{github.event.workflow_run.id }},
            });
            var matchArtifact = artifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "pr"
            })[0];
            var download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            });
            var fs = require('fs');
            fs.writeFileSync('${{github.workspace}}/pr.zip', Buffer.from(download.data));

      - run: unzip pr.zip

      - name: "Store github pr number"
        uses: actions/github-script@v8
        id: store_pr_number
        with:
          script: |
            let fs = require('fs');
            core.setOutput(
              'prNumber',
              fs.readFileSync('${{github.workspace}}/NR', 'utf8').trim()
            );

      - name: "Download artifact"
        uses: actions/github-script@v8
        with:
          script: |
            let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: context.payload.workflow_run.id,
            });
            let matchArtifact = allArtifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "storybook"
            })[0];
            let download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            });
            let fs = require('fs');
            fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/packages/openbridge-webcomponents/storybook.zip`, Buffer.from(download.data));

      - name: "Unzip artifact"
        run: cd packages/openbridge-webcomponents/ && mkdir -p storybook-static && unzip storybook.zip -d storybook-static

      # Node 24.17.0 has an HTTP keep-alive socket-reuse bug that causes
      # firebase-tools to hit "premature close" errors against googleapis.com,
      # leading to false-negative deploy failures. Pin to the patched 24.18.0.
      - name: Pin Node for Firebase deploy
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_OPENBRIDGE_DEMO }}"
          projectId: openbridge-demo
          entrypoint: "packages/openbridge-webcomponents"
          channelId: "pr-${{ steps.store_pr_number.outputs.prNumber }}"

      - name: "Comment on PR"
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            var fs = require('fs');
            var issue_number = ${{ steps.store_pr_number.outputs.prNumber }}
            // check if comment already exists
            var comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number
            });
            var commentExists = comments.data.some(comment => comment.body.includes('The storybook can be viewed at'));
            if (commentExists) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comments.data.find(comment => comment.body.includes('The storybook can be viewed at')).id,
                body: 'The storybook can be viewed at ${{ steps.firebase.outputs.details_url }}'
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: 'The storybook can be viewed at ${{ steps.firebase.outputs.details_url }}'
              });
            }

  deploy_demo_to_firebase:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Download pr artifact"
        uses: actions/github-script@v8
        with:
          script: |
            var artifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: ${{github.event.workflow_run.id }},
            });
            var matchArtifact = artifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "pr"
            })[0];
            var download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            });
            var fs = require('fs');
            fs.writeFileSync('${{github.workspace}}/pr.zip', Buffer.from(download.data));

      - run: unzip pr.zip

      - name: "Store github pr number"
        uses: actions/github-script@v8
        id: store_pr_number
        with:
          script: |
            let fs = require('fs');
            core.setOutput(
              'prNumber',
              fs.readFileSync('${{github.workspace}}/NR', 'utf8').trim()
            );

      - name: "Download artifact"
        uses: actions/github-script@v8
        with:
          script: |
            let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
               owner: context.repo.owner,
               repo: context.repo.repo,
               run_id: context.payload.workflow_run.id,
            });
            let matchArtifact = allArtifacts.data.artifacts.filter((artifact) => {
              return artifact.name == "vue-demo"
            })[0];
            let download = await github.rest.actions.downloadArtifact({
               owner: context.repo.owner,
               repo: context.repo.repo,
               artifact_id: matchArtifact.id,
               archive_format: 'zip',
            });
            let fs = require('fs');
            fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/packages/vue-demo/vue-demo.zip`, Buffer.from(download.data));

      - name: "Unzip artifact"
        run: cd packages/vue-demo/ && mkdir -p dist && unzip vue-demo.zip -d dist

      # Node 24.17.0 has an HTTP keep-alive socket-reuse bug that causes
      # firebase-tools to hit "premature close" errors against googleapis.com,
      # leading to false-negative deploy failures. Pin to the patched 24.18.0.
      - name: Pin Node for Firebase deploy
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        id: firebase
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_OPENBRIDGE_DEMO }}"
          projectId: openbridge-demo
          entrypoint: "packages/vue-demo"
          channelId: "pr-${{ steps.store_pr_number.outputs.prNumber }}"

      - name: "Comment on PR"
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            var fs = require('fs');
            var issue_number = ${{ steps.store_pr_number.outputs.prNumber }}
            // check if comment already exists
            var comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number
            });
            var commentExists = comments.data.some(comment => comment.body.includes('The demo can be viewed at'));
            if (commentExists) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comments.data.find(comment => comment.body.includes('The demo can be viewed at')).id,
                body: 'The demo can be viewed at ${{ steps.firebase.outputs.details_url }}'
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: 'The demo can be viewed at ${{ steps.firebase.outputs.details_url }}'
              });
            }
